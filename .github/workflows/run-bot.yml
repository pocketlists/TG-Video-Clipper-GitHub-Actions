name: Telegram Large Video Clipper

on:

  workflow_dispatch:

  push:
    branches:
      - main

concurrency:

  group: telegram-video-clipper

  cancel-in-progress: true


jobs:

  run-bot:

    runs-on: ubuntu-24.04

    timeout-minutes: 350


    steps:

      # --------------------------------
      # Checkout
      # --------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # --------------------------------
      # Python
      # --------------------------------

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.10"


      # --------------------------------
      # System packages
      # --------------------------------

      - name: Install dependencies

        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            cmake \
            g++ \
            make \
            zlib1g-dev \
            libssl-dev \
            gperf \
            ffmpeg


      # --------------------------------
      # Build Telegram Local Bot API
      # --------------------------------

      - name: Build Telegram Local Bot API

        run: |

          git clone \
            --depth 1 \
            https://github.com/tdlib/telegram-bot-api.git

          cd telegram-bot-api

          mkdir build

          cd build

          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            ..

          cmake \
            --build . \
            --target telegram-bot-api \
            -j2

          sudo cp \
            bin/telegram-bot-api \
            /usr/local/bin/telegram-bot-api


      # --------------------------------
      # Python packages
      # --------------------------------

      - name: Install Python packages

        run: |

          python -m pip install \
            --upgrade pip

          pip install \
            -r requirements.txt


      # --------------------------------
      # Start Local Bot API
      # --------------------------------

      - name: Start Local Telegram API

        env:

          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}

          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

        run: |

          mkdir -p telegram-data

          telegram-bot-api \
            --api-id="${TELEGRAM_API_ID}" \
            --api-hash="${TELEGRAM_API_HASH}" \
            --local \
            --http-port=8081 \
            --dir="$(pwd)/telegram-data" \
            > telegram-api.log 2>&1 &

          echo $! > telegram-api.pid

          echo "Waiting for Telegram Local Bot API..."

          for i in {1..60}; do

            if curl \
              -s \
              http://127.0.0.1:8081/ \
              > /dev/null; then

              echo "Telegram Local Bot API started."

              break

            fi

            sleep 2

          done


      # --------------------------------
      # Start Python bot
      # --------------------------------

      - name: Start Video Clipper Bot

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}

          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

          TELEGRAM_LOCAL_API: http://127.0.0.1:8081

        run: |

          python bot.py
